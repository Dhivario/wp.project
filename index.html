<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP | ATELIER LOADING</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #080808; --white: #ffffff; --gold: #bd9354; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--dark); font-family: 'Montserrat', sans-serif; overflow: hidden; }
        
        /* Particle Background */
        #dust-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 1; }

        #loader { 
            position: fixed; inset: 0; background: radial-gradient(circle at center, #111 0%, #000 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 9999; transition: all 1.2s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .exit-anim { opacity: 0; filter: blur(20px); transform: scale(1.1); pointer-events: none; }

        .loader-content { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10; }
        
        .loader-logo { 
            font-family: 'Cinzel', serif; font-size: clamp(1.5rem, 6vw, 3rem); 
            color: var(--white); letter-spacing: 15px; text-transform: uppercase;
            background: linear-gradient(90deg, #333, #fff, #333);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .bar-wrapper { width: 280px; position: relative; margin-top: 40px; }
        .progress-container { width: 100%; height: 2px; background: rgba(255,255,255,0.05); overflow: hidden; }
        .progress-fill { position: absolute; height: 100%; width: 0%; background: var(--gold); box-shadow: 0 0 15px var(--gold); }
        
        #status-msg { 
            color: var(--gold); font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; 
            margin-top: 25px; transition: opacity 0.4s ease; font-weight: 400;
        }
    </style>
</head>
<body>
    <canvas id="dust-canvas"></canvas>

    <div id="loader">
        <div class="loader-content">
            <div class="loader-logo">WP Ornaments</div>
            <div class="bar-wrapper">
                <div class="progress-container"><div class="progress-fill" id="fill"></div></div>
            </div>
            <div id="status-msg">HANDCRAFTING HERITAGE</div>
        </div>
    </div>

    <script>
        // Multi-Language Logic
        const languages = [
            "Handcrafting Heritage",    // English
            "பாரம்பரியத்தை உருவாக்குதல்", // Tamil
            "L'art de l'Or",            // French
            "Maestria nell'Oro",        // Italian
            "Purity Redefined"          // English
        ];

        let langIndex = 0;
        const statusText = document.getElementById('status-msg');
        const fillBar = document.getElementById('fill');

        const cycleLang = setInterval(() => {
            statusText.style.opacity = 0;
            setTimeout(() => {
                langIndex = (langIndex + 1) % languages.length;
                statusText.innerText = languages[langIndex];
                statusText.style.opacity = 1;
            }, 400);
        }, 1000);

        // Progress Logic
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 1.5;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                clearInterval(cycleLang);
                setTimeout(() => {
                    document.getElementById('loader').classList.add('exit-anim');
                    setTimeout(() => { window.location.href = 'sec.html'; }, 1200);
                }, 500);
            }
            fillBar.style.width = progress + "%";
        }, 40);

        // Gold Dust Effect
        const canvas = document.getElementById('dust-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        class Particle {
            constructor() { 
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height; 
                this.size = Math.random() * 1.2; 
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() { this.x += this.speedX; this.y += this.speedY; }
            draw() { 
                ctx.fillStyle = `rgba(189, 147, 84, ${Math.random()})`; 
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); 
            }
        }

        for(let i=0; i<120; i++) particles.push(new Particle());
        function animate() { 
            ctx.clearRect(0,0,canvas.width, canvas.height); 
            particles.forEach(p => { p.update(); p.draw(); }); 
            requestAnimationFrame(animate); 
        }
        animate();
    </script>
</body>
</html>
